<header class="app-header">
  <a href="{{ url_for('index') }}" class="header-logo">
    <div class="brand">
        <div class="logo-box">D</div>
        <div class="brand-text">
          <span class="wordmark" style="font-size:20px;">MyDocument</span>
          {% if admin_mode %}
            <span class="brand-mode">Admin Mode</span>
          {% endif %}
          <span class="version-tag">ver. 1.0</span>
        </div>
    </div>
  </a>
  <div class="header-actions">
    <form action="{{ url_for('logout') }}" method="get">
      <button type="submit" class="btn btn-primary btn-sm">&#8594;] Logout</button>
    </form>
    {% if current_user %}
      <div class="avatar">{{ current_user.username }}</div>
    {% endif %}
  </div>
</header>
